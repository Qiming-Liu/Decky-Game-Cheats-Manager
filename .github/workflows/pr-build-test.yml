name: PR Build & Test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  frontend:
    name: Frontend build & type-check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Setup Python for GCM generation
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm exec tsc --noEmit

      - name: Frontend unit tests
        run: node --test tests/frontend/*.test.mjs tests/tooling/*.test.mjs

      - name: Build
        run: pnpm run build

  backend:
    name: Backend syntax & unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          # Same CPython as Decky Loader's bundled interpreter, since the
          # vendored rapidfuzz wheel is built per CPython version.
          python-version: '3.14'

      - name: Setup uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

      - name: Vendor Python dependencies
        run: bash scripts/vendor_deps.sh

      - name: Generate GCM core
        run: python scripts/build_gcm_core.py

      - name: Syntax-check every module
        run: |
          python -m py_compile main.py
          find py_modules -path py_modules/_vendor -prune -o -name '*.py' -print0 | xargs -0 python -m py_compile

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  native:
    name: Trainer starter build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build with MinGW-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64
          bash scripts/build_native.sh

      - name: Upload starter
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gcm-start
          path: |
            bin/gcm-start.exe
            bin/gcm-pipewait.dll

  plugin-manifest:
    name: Validate plugin.json
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check plugin.json is valid JSON with required fields
        run: |
          python - <<'PY'
          import json
          with open("plugin.json") as f:
              data = json.load(f)
          for field in ("name", "author", "flags", "api_version"):
              assert field in data, f"plugin.json missing required field: {field}"
          print("plugin.json OK:", data["name"])
          PY

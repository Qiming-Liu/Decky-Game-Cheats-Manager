name: Build & Publish

# Prepare the version, build/test/package, then push the version and tag atomically.

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Version bump'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      prerelease:
        description: 'Mark as a pre-release'
        required: false
        type: boolean
        default: false
      notes:
        description: "What's new in this release (used as the release notes summary; leave blank for a generic note)"
        required: false
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build-and-publish:
    # Releases come from main only, so the version commit and tag land there.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Bump version
        id: bump
        shell: bash
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          case "${{ inputs.release_type }}" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac
          NEW="$MAJOR.$MINOR.$PATCH"
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            p.version = '$NEW';
            fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          "
          echo "version=$NEW" >> "$GITHUB_OUTPUT"
          echo "Bumping $CURRENT -> $NEW (${{ inputs.release_type }})"

      - name: Setup Python for GCM generation
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Setup uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

      - name: Vendor Python dependencies
        run: bash scripts/vendor_deps.sh

      - name: Build trainer starter
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64
          bash scripts/build_native.sh

      - name: Verify
        run: |
          pnpm run typecheck
          node --test tests/frontend/*.test.mjs tests/tooling/*.test.mjs
          python -m unittest discover -s tests -v

      - name: Inject GCM data-source secrets
        env:
          # base64 of the private GCM data-source configuration exactly as supplied
          # by its author, and of the platform binding that maps its Windows-only
          # storage onto gcm_auth_platform. Neither is part of this repository.
          # Set both in repo Settings → Secrets and variables → Actions.
          GCM_SECRET_CONFIG: ${{ secrets.GCM_SECRET_CONFIG }}
          GCM_PLATFORM_BINDING: ${{ secrets.GCM_PLATFORM_BINDING }}
        run: |
          if [ -z "$GCM_SECRET_CONFIG" ] || [ -z "$GCM_PLATFORM_BINDING" ]; then
            echo "GCM_SECRET_CONFIG and GCM_PLATFORM_BINDING are required to fetch the release catalog."
            exit 1
          fi
          echo "$GCM_SECRET_CONFIG" | base64 -d > py_modules/secret_config.py
          echo "$GCM_PLATFORM_BINDING" | base64 -d > py_modules/gcm_auth_binding.py
          chmod 600 py_modules/secret_config.py py_modules/gcm_auth_binding.py
          echo "GCM authentication configured for this build."

      - name: Generate authenticated GCM core
        run: python scripts/build_gcm_core.py

      - name: Fetch release catalog
        run: python scripts/fetch_release_database.py

      - name: Resolve tag
        id: vars
        shell: bash
        run: |
          TAG="v${{ steps.bump.outputs.version }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: $TAG"

      - name: Package protected plugin
        run: python scripts/package_release.py --output "DeckyGCM.${{ steps.vars.outputs.tag }}.zip"

      - name: Commit and tag version bump
        id: release_commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "Release v${{ steps.bump.outputs.version }}"
          git tag "v${{ steps.bump.outputs.version }}"
          git push --atomic origin HEAD:${{ github.ref_name }} "v${{ steps.bump.outputs.version }}"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: Decky Game Cheats Manager ${{ steps.vars.outputs.tag }}
          body: |
            ${{ inputs.notes || format('Routine build from commit `{0}`, no functional changes called out.', steps.release_commit.outputs.sha) }}

            Install via Decky Loader's "Install from ZIP" option, or extract
            `DeckyGCM.${{ steps.vars.outputs.tag }}.zip` into your Decky plugins directory.
          prerelease: ${{ inputs.prerelease }}
          files: DeckyGCM.${{ steps.vars.outputs.tag }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

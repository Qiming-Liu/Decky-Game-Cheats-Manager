name: Feature request
description: Suggest an improvement or a new feature for DeckyGCM.
labels: [enhancement]
body:
  - type: checkboxes
    id: searched
    attributes:
      label: Existing issues
      options:
        - label: I searched the existing issues and this is not requested yet.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what makes it hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How you would like it to work.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other solutions or workarounds you have considered.

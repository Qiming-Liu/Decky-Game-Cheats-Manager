# GitLab CI for the primary repository: checks only. The GitHub Actions
# workflows in .github/ stay unchanged for the GitHub mirror.
#
# Merge requests, pushes to main and manual runs (Build > Pipelines > Run
# pipeline, or the API, e.g. glab ci run) build, type-check and test the plugin and build the trainer starter.
# Releases are not made here: they are built and packaged locally, then uploaded
# to GitLab. The native job's artifact (bin/gcm-start.exe, bin/gcm-pipewait.dll,
# built with MinGW-w64) may be used for a release; download it from the
# pipeline of the commit being released.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

variables:
  GIT_SUBMODULE_STRATEGY: recursive

stages:
  - check

# Python 3.14 is Decky Loader's bundled interpreter, which the vendored
# rapidfuzz wheel is built for.
default:
  image: python:3.14

frontend:
  stage: check
  # Plus Node 22 and pnpm 9.
  before_script:
    - |
      set -eu
      base="https://nodejs.org/dist/latest-v22.x"
      curl -fsSLO "$base/SHASUMS256.txt"
      file=$(grep -o "node-v[0-9.]*-linux-x64.tar.xz" SHASUMS256.txt)
      curl -fsSLO "$base/$file"
      grep " $file\$" SHASUMS256.txt | sha256sum -c -
      tar -xJf "$file" -C /usr/local --strip-components=1
      rm -f "$file" SHASUMS256.txt
      npm install -g --silent pnpm@9
  script:
    - pnpm install --frozen-lockfile
    - pnpm exec tsc --noEmit
    - node --test tests/frontend/*.test.mjs tests/tooling/*.test.mjs
    - pnpm run build

backend:
  stage: check
  before_script:
    - pip install --quiet --root-user-action=ignore uv
  script:
    - bash scripts/vendor_deps.sh
    - python scripts/build_gcm_core.py
    - python -m py_compile main.py
    - find py_modules -path py_modules/_vendor -prune -o -name '*.py' -print0 | xargs -0 python -m py_compile
    - python -m unittest discover -s tests -v

native:
  stage: check
  variables:
    GIT_SUBMODULE_STRATEGY: none
  script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends gcc-mingw-w64-x86-64 >/dev/null
    - bash scripts/build_native.sh
  artifacts:
    name: gcm-start
    paths:
      - bin/gcm-start.exe
      - bin/gcm-pipewait.dll
    expire_in: 3 months

plugin-manifest:
  stage: check
  variables:
    GIT_SUBMODULE_STRATEGY: none
  script:
    - |
      python - <<'PY'
      import json
      with open("plugin.json") as f:
          data = json.load(f)
      for field in ("name", "author", "flags", "api_version"):
          assert field in data, f"plugin.json missing required field: {field}"
      print("plugin.json OK:", data["name"])
      PY
